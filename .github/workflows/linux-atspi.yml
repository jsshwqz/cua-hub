name: Linux AT-SPI runtime

# The accessibility backend for Linux is dispatched only on that platform, so
# the workspace CI proves it compiles, not that it works. This job runs the real
# thing: Xvfb, a session bus with the GNOME accessibility service activatable, a
# GTK3 window, and the MCP server driving it. It is manual by default and runs
# automatically when the backend itself changes, so an ordinary push does not
# spend the quota on a graphical session.

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/cua-engine-access/src/atspi.rs"
      - "crates/cua-engine-access/src/lib.rs"
      - "scripts/linux-atspi-runtime.py"
      - "tests/linux_atspi/**"
      - ".github/workflows/linux-atspi.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install a graphical session with accessibility
        run: |
          sudo apt-get update
          # The same display and input libraries the workspace needs to build,
          # plus a session the accessibility bus can live in. x11-utils is only
          # there so a failure can say whether X saw the window at all.
          sudo apt-get install -y \
            libxdo-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgbm-dev \
            libdrm-dev pkg-config \
            xvfb dbus-x11 at-spi2-core libatk-bridge2.0-0 x11-utils openbox \
            python3-gi gir1.2-gtk-3.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Debug, not release: this job proves the backend works against a live
      # accessibility bus. Compilation speed is the bottleneck here, not capture.
      - name: Build the CLI
        run: cargo build --bin cua-hub

      - name: Drive a real AT-SPI session
        env:
          CUA_HUB_BIN: ${{ github.workspace }}/target/debug/cua-hub
        run: |
          Xvfb :99 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          export NO_AT_BRIDGE=0
          # A window manager, so the session looks like a desktop: managed
          # windows carry the properties a window list reads.
          openbox > /tmp/openbox.log 2>&1 &
          sleep 2
          dbus-run-session -- bash scripts/linux-atspi-session.sh

      - name: Show what the display and the bus looked like
        if: failure()
        run: |
          echo "--- Xvfb ---"; tail -5 /tmp/xvfb.log || true
          echo "--- openbox ---"; tail -5 /tmp/openbox.log || true
          echo "--- X windows ---"
          DISPLAY=:99 xwininfo -root -tree 2>&1 | head -20 || true

      - name: Upload the evidence
        if: always()
        # The PASS/FAIL table above is the evidence; the zip is a convenience copy.
        # Artifact storage is an account-level quota (measured 2026-10-24: this repo
        # holds 7MB of 15 artifacts, yet the upload was refused), so a full account
        # must not turn a healthy accessibility run red -- that red reads exactly
        # like "the backend broke" to whoever is reviewing the PR.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: linux-atspi-evidence
          path: atspi-evidence/
          if-no-files-found: warn
