# cua-hub 自动发版流水线（Windows + Linux + macOS）
#
# 触发：推送 v* 标签（如 v0.1.5）后，GitHub 自动构建、打包，
# 并把成品挂到一个【草稿】Release 上；维护者写好发布说明后点发布即可。
# workflow_dispatch 手动触发只产出 artifact、不建 Release。

name: Release cua-hub

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build cua-hub (release)
        run: cargo build --release -p cua-cli --target x86_64-pc-windows-msvc
      - name: Package zip
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $ver = "dev"
          }
          echo "PKG_NAME=cua-hub-windows-x64-$ver.zip" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/cua-hub.exe dist/
          Copy-Item README.md dist/
          Copy-Item CHANGELOG.md dist/
          Copy-Item integrations/skill/SKILL.md dist/
          Compress-Archive -Path dist/* -DestinationPath "cua-hub-windows-x64-$ver.zip"
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: cua-hub-windows-x64
          path: ${{ env.PKG_NAME }}
      - name: Attach to draft GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: ${{ env.PKG_NAME }}

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libpipewire-0.3-dev libclang-dev libegl-dev libgbm-dev libdrm-dev tesseract-ocr
      - name: Build cua-hub (release)
        run: cargo build --release -p cua-cli --target x86_64-unknown-linux-gnu
      - name: Package tarball
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then ver="${{ github.ref_name }}"; ver="${ver#v}"; else ver="dev"; fi
          echo "PKG_NAME=cua-hub-linux-x64-$ver.tar.gz" >> $GITHUB_ENV
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/cua-hub dist/
          cp README.md dist/ && cp CHANGELOG.md dist/ && cp integrations/skill/SKILL.md dist/
          tar -czf "cua-hub-linux-x64-$ver.tar.gz" -C dist .
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: cua-hub-linux-x64
          path: ${{ env.PKG_NAME }}
      - name: Attach to draft GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: ${{ env.PKG_NAME }}

  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build cua-hub (release)
        run: cargo build --release -p cua-cli --target x86_64-apple-darwin
      - name: Package tarball
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then ver="${{ github.ref_name }}"; ver="${ver#v}"; else ver="dev"; fi
          echo "PKG_NAME=cua-hub-macos-x64-$ver.tar.gz" >> $GITHUB_ENV
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/cua-hub dist/
          cp README.md dist/ && cp CHANGELOG.md dist/ && cp integrations/skill/SKILL.md dist/
          tar -czf "cua-hub-macos-x64-$ver.tar.gz" -C dist .
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: cua-hub-macos-x64
          path: ${{ env.PKG_NAME }}
      - name: Attach to draft GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: ${{ env.PKG_NAME }}

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build cua-hub (release)
        run: cargo build --release -p cua-cli --target aarch64-apple-darwin
      - name: Package tarball
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then ver="${{ github.ref_name }}"; ver="${ver#v}"; else ver="dev"; fi
          echo "PKG_NAME=cua-hub-macos-arm64-$ver.tar.gz" >> $GITHUB_ENV
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/cua-hub dist/
          cp README.md dist/ && cp CHANGELOG.md dist/ && cp integrations/skill/SKILL.md dist/
          tar -czf "cua-hub-macos-arm64-$ver.tar.gz" -C dist .
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: cua-hub-macos-arm64
          path: ${{ env.PKG_NAME }}
      - name: Attach to draft GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: ${{ env.PKG_NAME }}
