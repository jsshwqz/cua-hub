[package]
name = "cua-engine-perception"
description = "Vision element parsing contract for cua-hub: element tables, set-of-mark rendering, model views without coordinates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
windows-future = "0.3.2"

[dev-dependencies]
cua-io = { path = "../cua-io" }

[[example]]
name = "ocr_smoke"
