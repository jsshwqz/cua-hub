[package]
name = "cua-engine-access"
description = "OS accessibility-tree snapshots for cua-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cua-core = { path = "../cua-core" }
serde.workspace = true
# Pure-Rust D-Bus client; used by the Linux AT-SPI backend. Kept unconditional
# so the module type-checks on every host, not just Linux.
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }
