[workspace]
resolver = "2"
members = [
    "crates/cua-types",
    "crates/cua-runtime",
    "crates/cua-brain",
    "crates/cua-orchestrator",
    "crates/cua-bench",
    "crates/cua-web",
    "crates/cua-mcp",
    "apps/cua-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
